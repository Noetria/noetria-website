name: Deploy to IONOS

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare public files
        run: |
          mkdir -p "$RUNNER_TEMP/noetria-deploy"
          rsync -a --delete             --exclude=".git/"             --exclude=".github/"             --exclude="README.md"             ./ "$RUNNER_TEMP/noetria-deploy/"

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to IONOS
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_PORT: ${{ secrets.IONOS_PORT }}
          IONOS_USERNAME: ${{ secrets.IONOS_USERNAME }}
          IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
        run: |
          lftp -u "$IONOS_USERNAME","$IONOS_PASSWORD" "sftp://$IONOS_HOST:$IONOS_PORT" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 20
          set sftp:auto-confirm yes
          mirror --reverse --delete --verbose "$RUNNER_TEMP/noetria-deploy" /
          bye
          EOF
