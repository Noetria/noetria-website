name: Deploy test site to IONOS

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy test website
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Prepare test files
        run: |
          mkdir -p "$RUNNER_TEMP/noetria-test"

          rsync -a --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="README.md" \
            ./ "$RUNNER_TEMP/noetria-test/"

          # Environnement /test/ uniquement : toutes les pages indexables en production
          # deviennent « noindex, follow » dans la copie de test. Les fichiers du dépôt
          # et le déploiement de production (deploy.yml, branche main) ne sont pas modifiés.
          find "$RUNNER_TEMP/noetria-test" -type f -name "*.html" -exec sed -i \
            's/<meta name="robots" content="index, follow">/<meta name="robots" content="noindex, follow">/' {} +

          # Contrôle chaque page HTML : la balise robots doit exister et interdire l'indexation.
          TEST_SITE_DIR="$RUNNER_TEMP/noetria-test" python3 - <<'PY'
          from html.parser import HTMLParser
          import os
          from pathlib import Path
          import sys

          class RobotsChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.robots = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "meta":
                      attributes = {key.lower(): value or "" for key, value in attrs}
                      if attributes.get("name", "").lower() == "robots":
                          self.robots.append(attributes.get("content", ""))

          errors = []
          for page in Path(os.environ["TEST_SITE_DIR"]).rglob("*.html"):
              parser = RobotsChecker()
              parser.feed(page.read_text(encoding="utf-8"))
              directives = [
                  directive.strip().lower()
                  for content in parser.robots
                  for directive in content.split(",")
              ]
              if not parser.robots or "noindex" not in directives or "index" in directives:
                  errors.append(str(page))

          if errors:
              print("Erreur : balise robots absente ou page de test indexable :", file=sys.stderr)
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy to IONOS test directory
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_PORT: ${{ secrets.IONOS_PORT }}
          IONOS_USERNAME: ${{ secrets.IONOS_USERNAME }}
          IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
        run: |
          lftp -u "$IONOS_USERNAME","$IONOS_PASSWORD" "sftp://$IONOS_HOST:$IONOS_PORT" <<EOF
          set cmd:fail-exit no
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 20
          set sftp:auto-confirm yes

          mirror --reverse --delete --verbose "$RUNNER_TEMP/noetria-test" test

          chmod 755 test
          chmod 755 test/assets
          chmod 755 test/assets/css
          chmod 755 test/assets/images

          bye
          EOF
